<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Soft shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E466B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle - solid color -->
  <circle cx="50" cy="50" r="46" fill="#1E466B" filter="url(#dropShadow)"/>

  <!-- Container layers -->
  <!-- Top layer -->
  <rect x="30" y="28" width="40" height="14" rx="3" ry="3"
        fill="none" stroke="#FAFAFA" stroke-width="3" opacity="0.95"/>

  <!-- Middle layer -->
  <rect x="30" y="43" width="40" height="14" rx="3" ry="3"
        fill="none" stroke="#FAFAFA" stroke-width="3" opacity="0.95"/>

  <!-- Bottom layer -->
  <rect x="30" y="58" width="40" height="14" rx="3" ry="3"
        fill="none" stroke="#FAFAFA" stroke-width="3" opacity="0.95"/>

  <!-- H shape connection lines -->
  <line x1="42" y1="35" x2="42" y2="65" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="35" x2="58" y2="65" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round"/>

  <!-- Center horizontal line -->
  <line x1="42" y1="50" x2="58" y2="50" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round"/>
</svg>
